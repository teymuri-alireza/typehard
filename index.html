<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src-tauri/assets/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="./src/index.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="header-row">
        <h1>Title: <span id="title"></span></h1>
        <div class="header-controls">
          <p class="lesson-tag" id="lessonDifficulty"></p>
          <button id="themeToggleBtn" aria-label="Toggle theme">🌙</button>
        </div>
      </div>

      <br />

      <div class="stats-row">
        <p class="stat left">WPM: <span id="wpm">0</span></p>
        <p class="stat center">Accuracy: <span id="accuracy">100</span> %</p>
        <p class="stat right">Elapsed Time: <span id="elapsedTime">0</span> seconds</p>
      </div>

      <p id="lesson"></p>

      <p
        id="keys"
        tabindex="0"
        role="textbox"
        aria-label="keys input"
        aria-readonly="false"
        contenteditable="true"
        spellcheck="false"
      ></p>

      <div class="footer-row">
        <button id="nextLessonBtn" aria-label="Next lesson">Next Lesson</button>
      </div>
    </main>
  </body>
</html>

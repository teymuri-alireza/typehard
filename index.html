<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src-tauri/assets/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="./src/index.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="header-row">
        <h1>Welcome to TypeHard</h1>
        <p class="lesson-tag" id="lessonDifficulty"></p>
      </div>

      <div class="row"></div>

      <p id="lesson"></p>
      <p>WPM: <span id="wpm"></span></p>
      <p>Accuracy: <span id="accuracy"></span> %</p>
      <p>Elapsed Time: <span id="elapsedTime"></span> seconds</p>
      <p
        id="keys"
        tabindex="0"
        role="textbox"
        aria-label="keys input"
        aria-readonly="false"
        contenteditable="true"
        spellcheck="false"
      ></p>
    </main>
  </body>
</html>

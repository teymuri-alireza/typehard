<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src-tauri/assets/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeHard</title>
    <script type="module" src="./src/index.ts" defer></script>
  </head>

  <body>
    <main class="container">
    
      <header class="topbar">
        <div class="brand">TypeHard</div>
        <nav class="main-nav">
          <button data-view="typing">Type</button>
          <button data-view="lessons">Lessons</button>
          <button data-view="statistics">Statistics</button>
          <button data-view="settings">Settings</button>
        </nav>
      </header>

      <br />
      <hr class="divider"/>
      <br />

      <section id="typingView">

        <div class="title-row">
          <h1>Title: <span id="title"></span></h1>
          <p class="lesson-tag" id="lessonDifficulty"></p>
        </div>

        <div class="stats-row">
          <div class="stat">
              <span class="stat-value" id="wpm">0</span>
              <span class="stat-label">WPM</span>
          </div>

          <div class="stat">
              <span class="stat-value" id="accuracy">100</span>
              <span class="stat-label">Accuracy</span>
          </div>

          <div class="stat">
              <span class="stat-value" id="elapsedTime">0</span>
              <span class="stat-label">Time</span>
          </div>
        </div>

        <p id="lesson"></p>

        <div class="helperTextsHolder">
          <p id="helperText"></p>
          <p>Navigate between lessons using arrow keys.</p>
        </div>

        <div class="footer-row">
          <button id="resetSessionBtn" aria-label="Reset Session">Reset session</button>
        </div>

      </section>

      <section id="lessonsView" hidden></section>

      <section id="statisticsView" hidden></section>

      <section id="settingsView" hidden></section>

    </main>
  </body>
</html>

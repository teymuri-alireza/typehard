<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src-tauri/assets/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeHard</title>
    <script type="module" src="./src/index.ts" defer></script>
  </head>

  <body>
    <main class="container">
    
      <header class="topbar">
        <div class="brand">TypeHard</div>
        <nav class="main-nav">
          <button data-view="practice">Practice</button>
          <button data-view="learn">Learn</button>
          <button data-view="lessons">Library</button>
          <button data-view="statistics">Statistics</button>
          <button data-view="settings">Settings</button>
        </nav>
      </header>

      <br />
      <hr class="divider"/>
      <br />

      <section id="practiceView">

        <div class="title-row">

          <div>
            <h1 id="title"></h1>
            <p>
              <span id="lessonAuthor">undefined</span>
              <span>
                .
              </span>
              <span class="lesson-tag" id="lessonLabel"></span>
            </p>
          </div>

          <div class="right-typing-header">

            <div class="info-icon-dropdown" style="float:right;">

                <img id="infoIcon" alt="Info icon" class="dropbtn"/>

                <div class="dropdown-content">
                    <p>Use <code>Ctrl+Alt+R</code> to reset session.</p>
                    <p>Press the <code>Esc</code> key to pause the lesson.</p>
                    <p>Press the <code>🠖</code> key to go to the next lesson.</p>
                    <p>Press the <code>🠔</code> key to go to the previous lesson.</p>
                </div>

                <div id="resetSessionDropdown" class="error-dropdown" aria-hidden="true" hidden role="alert"></div>
            </div>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat">
              <span class="stat-value" id="wpm">0.00</span>
              <span class="stat-label">WPM</span>
          </div>

          <div class="stat">
              <span class="stat-value" id="accuracy">100.00</span>
              <span class="stat-label">Accuracy</span>
          </div>

          <div class="stat">
              <span class="stat-value" id="elapsedTime">0.0</span>
              <span class="stat-label">Time</span>
          </div>
        </div>

        <p id="lesson"></p>

        <div class="helperTextsHolder">
          <p id="helperText"></p>
          <p id="navigationHelperText">Navigate between lessons using arrow keys.</p>
        </div>

      </section>

      <section id="learningView" hidden></section>

      <section id="lessonsView" hidden></section>

      <section id="statisticsView" hidden></section>

      <section id="settingsView" hidden></section>

    </main>
  </body>
</html>

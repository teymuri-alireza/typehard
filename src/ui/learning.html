<div class="view-content">
    <div class="title-row">
        <h1>Title: <span id="title"></span></h1>
        <p class="lesson-tag" id="lessonLabel"></p>
    </div>

    <div class="stats-row">
        <div class="stat">
            <span class="stat-value" id="wpm">0.00</span>
            <span class="stat-label">WPM</span>
        </div>

        <div class="stat">
            <span class="stat-value" id="accuracy">0.00</span>
            <span class="stat-label">Accuracy</span>
        </div>

        <div class="stat">
            <span class="stat-value" id="elapsedTime">0.0</span>
            <span class="stat-label">Time</span>
        </div>
    </div>

    <p id="description"></p>

    <p id="lesson" class="learningLesson"></p>

    <div class="learning-footer-row">
        <div>
            <button id="resetSessionBtn" aria-label="Reset Session">Reset session</button>
            <div id="resetSessionDropdown" class="error-dropdown" aria-hidden="true" hidden role="alert"></div>
        </div>
        <div>
            <button id="previousLessonBtn" aria-label="Previous Lesson">Previous lesson</button>
            <button id="nextLessonBtn" aria-label="Next Lesson">Next lesson</button>
        </div>
    </div>

    <div id="keyboard"></div>

</div>

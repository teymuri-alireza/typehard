<div class="view-content lessons-view">
  <aside class="lessons-sidebar">
    <div class="lessons-menu-row" role="tablist" aria-label="Lesson tabs">
      <button class="lessons-tab is-active" id="practiceLessonBtn" type="button" aria-selected="true">
        Practice Drills
      </button>
      <button class="lessons-tab" type="button" id="learningLessonBtn" aria-selected="false">
        Touch Typing
      </button>
    </div>
  </aside>

  <main class="lessons-panels">
    <section class="lessons-panel is-active" id="practiceLessonsView" aria-labelledby="practiceLessonBtn">
      <header class="view-header">
        <div>
          <p class="eyebrow">Focused practice</p>
          <h3>Practice</h3>
        </div>
      </header>

      <div class="lesson-filters">
        <input
            id="lessonSearch"
            type="search"
            placeholder="Search lessons by title or author..."
            autocomplete="off"
        />

        <select id="difficultyFilter">
            <option value="all">All Difficulties</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>
      </div>

      <div id="practiceLessonsList" class="lessons-list" aria-live="polite"></div>
    </section>

    <section class="lessons-panel" id="learningLessonsView" hidden aria-labelledby="learningLessonBtn">
      <header class="view-header">
        <div>
          <p class="eyebrow">Learn typing</p>
          <h3>Learning</h3>
        </div>
      </header>

      <div id="learningLessonsList" class="lessons-list" aria-live="polite"></div>

    </section>
  </main>
</div>

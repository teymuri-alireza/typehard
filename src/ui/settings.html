<div class="view-content settings-view">
  <header class="view-header">
    <div>
      <h3>Settings</h3>
    </div>
  </header>

  <section class="setting-row" id="changeFont">
    <label for="fontSelect" class="setting-label">Application font</label>

    <div class="setting-control">
      <select id="fontSelect" class="setting-select">
        <option value="system">System Default</option>
        <option value="sans">Sans Serif</option>
        <option value="serif">Serif</option>
        <option value="moonspace">Moonspace</option>
      </select>

      <p class="setting-help">Choose a font for the application UI.</p>
    </div>

  </section>

  <section class="setting-row" id="changeFontSize">
    <label for="fontSizeSelect" class="setting-label">Lesson font size</label>

    <div class="setting-control">
      <select id="fontSizeSelect" class="setting-select">
        <option value="small">Small</option>
        <option value="medium" selected>Medium</option>
        <option value="large">Large</option>
      </select>

      <p class="setting-help">Choose a font size for the lesson UI.</p>
    </div>

  </section>

  <section class="setting-row" id="changeTheme">
    <label for="themeSelect" class="setting-label">Application theme</label>

    <div class="setting-control">
      <select id="themeSelect" class="setting-select">
        <option value="light">light</option>
        <option value="light_blue">light blue</option>
        <option value="dark">dark</option>
        <option value="dark_yellow">dark yellow</option>
        <option value="dark_pink">dark pink</option>
        <option value="green_nature">green nature</option>
        <option value="warm_purple">warm purple</option>
      </select>

      <p class="setting-help">Choose a theme for the application.</p>
    </div>

  </section>

  <section class="setting-row" id="toggleSound">
    <label for="toggleKeyboardSound" class="setting-label">Keyboard sound</label>

    <div class="setting-control">
      <label class="toggle-switch" for="toggleKeyboardSound">
        <input id="toggleKeyboardSound" type="checkbox" />
        <span class="switch" aria-hidden="true"></span>
      </label>

      <p class="setting-help">Play the keyboard sound.</p>
    </div>

  </section>

  <div class="about-view">
    <h4>About TypeHard</h4>

    <div class="about-meta">
      <span class="about-label">Version:</span>
      <span id="appVersionOutput">Loading...</span>
    </div>

    <a class="about-link" href="https://github.com/teymuri-alireza/typehard" target="_blank" rel="noreferrer" title="Check the source code on GitHub.">
      Source Code
    </a>

    <h4>Credits</h4>

    <div class="about-meta">
      <span class="about-label">Mechanical Keyboard sound provided by:</span>
      <span>
        <a class="about-link" href="https://freesound.org/people/chris112233/sounds/738440/?" target="_blank", rel="noreferrer">freesound.org</a>
      </span>
    </div>

</div>
